spring:
  application:
    name: e-learning-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_db
    username: app_user
    password: app_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

app:
  jwt:
    secret: eLearningPlatformSecretKeyForJWTTokenGeneration2026VeryLongSecureKey
    expiration-ms: 86400000
